[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysphagia-wearable"
version = "0.2.0"
description = "Capstone research pipelines for swallow timing and throat activity classification"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "scipy>=1.17,<2", "scikit-learn>=1.8,<2", "matplotlib>=3.10,<4", "joblib>=1.5,<2"]

[project.optional-dependencies]
neural = ["torch==2.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
